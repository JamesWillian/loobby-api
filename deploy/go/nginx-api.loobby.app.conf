# /etc/nginx/sites-available/api.loobby.app -- nginx na MESMA maquina do Go.
#
# O TLS publico (Let's Encrypt, renovado pelo timer do certbot) termina aqui. O
# Go escuta so em 127.0.0.1:8080, em HTTP puro e sem TLS mutuo: o trafego entre
# os dois nao sai da maquina. (O desenho antigo -- nginx no AWS, Go em outra
# maquina por TLS mutuo -- continua em deploy/nginx/ e deploy/certs/.)
#
# Instalacao e renovacao do certificado: deploy/go/README.md.

upstream loobby_go {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.loobby.app;

    # Desafio HTTP-01 do Let's Encrypt: a emissao e cada renovacao passam aqui.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.loobby.app;

    ssl_certificate     /etc/letsencrypt/live/api.loobby.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.loobby.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:loobby:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # Uploads: o Go aceita ate 10 MB por requisicao (internal/files, maxRequestSize).
    # O padrao do nginx, 1 MB, recusaria antes com 413.
    client_max_body_size 11m;

    location / {
        proxy_pass http://loobby_go;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # O WriteTimeout do Go e 60 s; o nginx espera um pouco mais.
        proxy_read_timeout 65s;
    }
}
