# Rotas do strangler: o estado da migracao Kotlin -> Go, em forma executavel.
# Contexto: http {}. Cada rota migrada e uma linha aqui; cada PR que migra um
# modulo mexe neste arquivo.
#
# Regra: rotear por (METODO, CAMINHO) EXATOS -- nunca por prefixo.
#
# Tudo que nao casar continua no Kotlin, inclusive as variacoes das rotas ja
# migradas: metodo errado, subpath inexistente, barra no fim, preflight CORS.
# Assim o Go so recebe o que implementa explicitamente, e o comportamento de
# erro dessas variacoes continua sendo o do Kotlin. Um `location /legal/` mandaria
# POST /legal/privacy para o Go (405) quando o Kotlin responde outra coisa -- e
# o cliente perceberia a troca.
#
# A chave usa $uri (normalizado, sem query string); o backend recebe a URI
# original, com query string, igual hoje.

map "$request_method $uri" $loobby_route {
    default  kotlin;

    # --- legal ---------------------------------------------------------------
    "~^(GET|HEAD) /legal/(privacy|account-deletion|child-safety)$"  go;
}

# KILL SWITCH. Trocar "loobby-go" por "loobby-kotlin" na linha "go" e dar
# `nginx -s reload` devolve TODAS as rotas migradas ao Kotlin de uma vez, sem
# tocar na lista acima. E o rollback de emergencia do strangler.
map $loobby_route $loobby_backend {
    go       loobby-go;
    default  loobby-kotlin;
}
