# Rotas do strangler: o estado da migracao Kotlin -> Go, em forma executavel.
# Contexto: http {}. Sao tres mapas, lidos de cima para baixo:
#
#   1. ROTAS:  (metodo, caminho) -> modulo.  O que o Go sabe atender.
#   2. PAINEL: modulo -> kotlin | go.        O que JA FOI migrado. O cutover de
#              um modulo e trocar UMA palavra aqui e dar `nginx -s reload`.
#   3. KILL SWITCH: devolve tudo ao Kotlin de uma vez.
#
# Regra das rotas: (METODO, CAMINHO) EXATOS -- nunca por prefixo. Tudo que nao
# casar continua no Kotlin, inclusive as variacoes das rotas migradas: metodo
# errado, subpath inexistente, barra no fim, preflight CORS.
#
# A chave usa $request_uri -- a URI CRUA, com a query string -- e nao $uri, que o
# nginx normaliza (decodifica %XX, junta barras). Por isso toda regra termina em
# (\?.*)?$. Os {id} aceitam 36 caracteres de hexadecimal e hifen; outras formas
# ficam no Kotlin.

map "$request_method $request_uri" $loobby_module {
    default  kotlin;

    # --- legal ---------------------------------------------------------------
    "~^(GET|HEAD) /legal/(privacy|account-deletion|child-safety)(\?.*)?$"  legal;

    # --- games ---------------------------------------------------------------
    # O id so com letras, digitos, - e _ (os ids do RAWG sao numeros ou slugs).
    "~^(GET|HEAD) /games/search(\?.*)?$"          games;
    "~^(GET|HEAD) /games/[A-Za-z0-9_-]+(\?.*)?$"  games;

    # --- files ---------------------------------------------------------------
    # Os uploads e a leitura dos arquivos migram JUNTOS: o arquivo fica no disco
    # de quem recebeu o upload. Antes de ligar, copie os uploads existentes para
    # a maquina do Go (deploy/go/README.md).
    "~^(GET|HEAD) /files/(avatars|groups)/[0-9a-fA-F-]{36}/[0-9]+\.(jpg|png|webp)(\?.*)?$"  files;
    "~^POST /users/me/avatar(\?.*)?$"                                        files;
    "~^POST /groups/[0-9a-fA-F-]{36}/image(\?.*)?$"                                         files;

    # --- notifications -------------------------------------------------------
    "~^POST /devices/register(\?.*)?$"                       notifications;
    "~^DELETE /devices/([A-Za-z0-9_:-]|%3[Aa])+(\?.*)?$"     notifications;

    # --- groups --------------------------------------------------------------
    "~^(GET|HEAD|POST) /groups(\?.*)?$"                              groups;
    "~^(GET|HEAD|PATCH|DELETE) /groups/[0-9a-fA-F-]{36}(\?.*)?$"                    groups;
    "~^(GET|HEAD) /groups/invite/(\$|%24)?[A-Za-z0-9_-]+(\?.*)?$"    groups;
    "~^(GET|HEAD|POST) /groups/[0-9a-fA-F-]{36}/members(\?.*)?$"                    groups;
    "~^DELETE /groups/[0-9a-fA-F-]{36}/members/(me|[0-9a-fA-F-]{36})(\?.*)?$"                      groups;

    # --- users ---------------------------------------------------------------
    "~^(GET|HEAD|PATCH|DELETE) /users/me(\?.*)?$"   users;
    "~^(GET|HEAD) /users/feed(\?.*)?$"              users;
    "~^PUT /users/me/password(\?.*)?$"              users;

    # --- events (com RSVP) ---------------------------------------------------
    "~^(GET|HEAD|POST) /groups/[0-9a-fA-F-]{36}/events(\?.*)?$"                     events;
    "~^POST /events/instant(\?.*)?$"                                 events;
    "~^(GET|HEAD|PUT|DELETE) /events/[0-9a-fA-F-]{36}(\?.*)?$"                      events;
    "~^(GET|HEAD) /events/invite/(\$|%24)?[A-Za-z0-9_-]+(\?.*)?$"    events;
    "~^(GET|HEAD|PUT) /events/[0-9a-fA-F-]{36}/rsvps(\?.*)?$"                       events;
    "~^(GET|HEAD|DELETE) /events/[0-9a-fA-F-]{36}/rsvps/me(\?.*)?$"                 events;

    # --- teams ---------------------------------------------------------------
    "~^(GET|HEAD|POST) /events/[0-9a-fA-F-]{36}/teams(\?.*)?$"            teams;
    "~^POST /events/[0-9a-fA-F-]{36}/teams/auto-generate(\?.*)?$"         teams;
    "~^(PUT|DELETE) /events/[0-9a-fA-F-]{36}/teams/[0-9a-fA-F-]{36}(\?.*)?$"             teams;
    "~^POST /events/[0-9a-fA-F-]{36}/teams/[0-9a-fA-F-]{36}/players(\?.*)?$"             teams;
    "~^(PUT|DELETE) /events/[0-9a-fA-F-]{36}/teams/[0-9a-fA-F-]{36}/players/[0-9a-fA-F-]{36}(\?.*)?$"   teams;

    # --- auth ----------------------------------------------------------------
    "~^POST /auth/(anonymous|register|login|google|refresh|resend-verification|forgot-password|reset-password)(\?.*)?$"  auth;
    "~^(GET|HEAD) /auth/(verify-email|reset-password)(\?.*)?$"                                                           auth;
}

# PAINEL DA MIGRACAO. Um modulo por vez, na ordem abaixo, com uma captura da
# suite de contrato entre um e outro (deploy/nginx/README.md).
map $loobby_module $loobby_route {
    default        kotlin;
    legal          go;
    games          go;
    files          kotlin;
    notifications  kotlin;
    groups         kotlin;
    users          kotlin;
    events         kotlin;
    teams          kotlin;
    auth           kotlin;
}

# KILL SWITCH. Trocar "loobby-go" por "loobby-kotlin" na linha "go" e dar
# `nginx -s reload` devolve TODAS as rotas migradas ao Kotlin de uma vez, sem
# tocar nos mapas acima. E o rollback de emergencia do strangler.
map $loobby_route $loobby_backend {
    go       loobby-go;
    default  loobby-kotlin;
}
