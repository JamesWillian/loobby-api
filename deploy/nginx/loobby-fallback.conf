# Fallback automatico para o Kotlin. Contexto: server {} de api.loobby.app
# (named location nao pode ficar dentro de outro location).
#
# Quando o Go nao responde (502 de conexao recusada, 504 de timeout), o nginx
# repete a requisicao no Kotlin -- MAS SO para GET e HEAD. Repetir um POST/PUT
# que talvez ja tenha sido processado pelo Go poderia gravar duas vezes; para
# esses, o cliente recebe o 502 e decide.
#
# O 502/504 vem do proprio nginx: respostas de erro que o Go devolve passam
# direto (sem proxy_intercept_errors, o error_page nao as intercepta).

location @loobby_kotlin_fallback {
    # Kotlin fora do ar nao tem para onde cair: devolve o erro, sem laco.
    if ($loobby_backend != "loobby-go") { return 502; }
    if ($request_method !~ ^(GET|HEAD)$) { return 502; }

    proxy_pass http://loobby-kotlin;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Replique aqui os demais proxy_set_header do location / atual.
}
