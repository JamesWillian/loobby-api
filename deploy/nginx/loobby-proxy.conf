# Proxy do strangler. Contexto: o `location / { }` do server de api.loobby.app.
#
# Inclua no lugar do proxy_pass atual. Os proxy_set_header que o location ja
# tiver (X-Forwarded-For, X-Real-IP...) continuam no MESMO location -- no nginx,
# definir proxy_set_header num nivel cancela os herdados do nivel de cima.

proxy_pass $loobby_scheme://$loobby_backend;
proxy_set_header Host $host;

# Keepalive com os upstreams (exigido pelo `keepalive` do loobby-go).
proxy_http_version 1.1;
proxy_set_header Connection "";

# TLS mutuo ate o Go. So tem efeito quando o esquema e https; o Kotlin ignora.
# O nginx confere que o servidor apresenta o certificado "loobby-go" assinado
# pela CA privada, e se identifica com o proprio certificado de cliente -- sem o
# qual o Go recusa o handshake.
proxy_ssl_certificate         /etc/nginx/loobby/nginx-client.crt;
proxy_ssl_certificate_key     /etc/nginx/loobby/nginx-client.key;
proxy_ssl_trusted_certificate /etc/nginx/loobby/ca.crt;
proxy_ssl_verify              on;
proxy_ssl_verify_depth        1;
proxy_ssl_name                loobby-go;
proxy_ssl_server_name         on;
proxy_ssl_session_reuse       on;

# Maquina nova fora do ar ou inalcancavel: desiste rapido e cai no Kotlin.
proxy_connect_timeout 3s;
error_page 502 504 = @loobby_kotlin_fallback;
