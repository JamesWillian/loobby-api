# Upstreams do strangler da Loobby API. Contexto: http {}.
#
# AJUSTE AO SEU AMBIENTE: os enderecos abaixo assumem os dois processos na mesma
# maquina. Se o Kotlin roda em container (ex.: http://app:8080), troque aqui.
#
# Os nomes usam hifen, nao underscore, por precaucao: sem um
# `proxy_set_header Host $host;` no server {}, o nginx manda o NOME DO UPSTREAM
# como Host. Hifen e valido em hostname (RFC 1123); underscore nao e, e ha
# servidores que recusam esse Host. Com o proxy_set_header a questao some.

upstream loobby-kotlin {
    server 127.0.0.1:8080;
}

upstream loobby-go {
    server 127.0.0.1:8081;
}
