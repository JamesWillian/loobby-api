# Upstreams do strangler da Loobby API. Contexto: http {}.
#
# O Kotlin roda em Docker no mesmo servidor do nginx (AWS). O Go roda em OUTRA
# maquina, e o caminho entre os dois atravessa a internet: por isso ele e
# alcancado por HTTPS com TLS mutuo (ver loobby-proxy.conf e deploy/certs/).
#
# AJUSTE: o endereco do Kotlin e o mesmo que o proxy_pass atual ja usa; o do Go
# e o IP publico da maquina nova.
#
# Nomes com hifen, nao underscore: sem `proxy_set_header Host`, o nginx manda o
# nome do upstream como Host, e underscore nao e valido em hostname.

upstream loobby-kotlin {
    server 127.0.0.1:8080;
}

upstream loobby-go {
    server IP_DA_MAQUINA_NOVA:8443;
    # Conexoes TLS reaproveitadas: o handshake atravessa a internet, e sem isto
    # seria pago a cada requisicao migrada.
    keepalive 8;
}

# Esquema por backend: o Kotlin fala HTTP puro (mesma maquina); o Go, HTTPS.
# Segue o $loobby_backend, entao o kill switch do routes.conf tambem troca o
# esquema -- rota devolvida ao Kotlin vira HTTP de novo.
map $loobby_backend $loobby_scheme {
    loobby-go  https;
    default    http;
}
